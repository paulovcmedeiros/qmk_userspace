name: Build QMK firmware

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.devcontainer/**'
      - '.vscode/**'
      - '.clang*'
      - '.editorconfig'
      - '**/.gitignore'
      - 'watch-ergo68-keymap.py'
      - 'keymap_drawer_config.yaml'
      - '**/keymap-documentation.json'
      - '**/keymap.svg'
      - '**/keymap-combos.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: master

  publish:
    name: 'QMK Userspace Publish'
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    needs: build
