draw_config:
    dark_mode: auto
    inner_pad_w: 3.0
    inner_pad_h: 3.0
    outer_pad_h: 44.0
    append_colon_to_layer_header: false
    small_pad: 10.0
    draw_key_sides: true
    key_side_pars:
        rel_x: 0
        rel_y: 0
        rel_w: 12
        rel_h: 12
        rx: 4
        ry: 4
    svg_extra_style: |-
        svg.keymap { font-size: 10px; }
        text:is(.combo,.hold,.shifted,.left,.right,.tl,.tr,.bl,.br) { font-size: 8px; }
        text.combo:is(.hold,.shifted,.left,.right) { font-size: 7px; }
        text.label {
            font-size: 16px;
            letter-spacing: 0.04em;
            stroke: none;
            paint-order: normal;
        }
        text.layer-activator {
            text-decoration: none;
            font-weight: bold;
        }
        path.combo {
            stroke-width: 0.8;
            opacity: 0.8;
        }
        g.layer-Mouse > text.label,
        a[href="#Mouse"] text.layer-activator {
            fill: #0969da;
        }
        g.layer-Numpad > text.label,
        a[href="#Numpad"] text.layer-activator {
            fill: #9a6700;
        }
        g.layer-Symbols > text.label,
        a[href="#Symbols"] text.layer-activator {
            fill: #1a7f37;
        }
        @media (prefers-color-scheme: dark) {
            g.layer-Mouse > text.label,
            a[href="#Mouse"] text.layer-activator {
                fill: #58a6ff;
            }
            g.layer-Numpad > text.label,
            a[href="#Numpad"] text.layer-activator {
                fill: #d29922;
            }
            g.layer-Symbols > text.label,
            a[href="#Symbols"] text.layer-activator {
                fill: #3fb950;
            }
        }
