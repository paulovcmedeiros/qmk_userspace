draw_config:
    key_w: 60.0
    key_h: 56.0
    split_gap: 30.0
    combo_w: 28.0
    combo_h: 26.0
    key_rx: 6.0
    key_ry: 6.0
    dark_mode: false
    n_columns: 1
    separate_combo_diagrams: false
    combo_diagrams_scale: 2
    inner_pad_w: 2.0
    inner_pad_h: 2.0
    outer_pad_w: 30.0
    outer_pad_h: 56.0
    line_spacing: 1.2
    arc_radius: 6.0
    append_colon_to_layer_header: true
    small_pad: 2.0
    legend_rel_x: 0.0
    legend_rel_y: 0.0
    draw_key_sides: false
    key_side_pars:
        rel_x: 0
        rel_y: 4
        rel_w: 12
        rel_h: 12
        rx: 4
        ry: 4
    svg_extra_style: |-
        svg.keymap { font-size: 12px; }
        text:is(.combo,.hold,.shifted,.left,.right,.tl,.tr,.bl,.br) { font-size: 9px; }
        text.combo:is(.hold,.shifted,.left,.right) { font-size: 7px; }
    footer_text: ""
    shrink_wide_legends: 7
    style_layer_activators: true
    glyph_tap_size: 14
    glyph_hold_size: 12
    glyph_shifted_size: 10
    glyphs: {}
parse_config:
    preprocess: true
    skip_binding_parsing: false
    raw_binding_map:
        QK_GESC:
            t: Esc
            s: "`"
        QK_LOCK: Key lock
        AS_TOGG: Auto Shift
        UG_TOGG: RGB toggle
        UG_PREV: RGB previous
        UG_NEXT: RGB next
        KC_ENT: Enter
        KC_ENTER: Enter
        KC_TAB: Tab
        RCTL_T(KC_ENT):
            t: Enter
            h: RCTL
        KC_PSLS: /
        KC_PMNS: "-"
        KC_PPLS: +
        KC_KP_ASTERISK: "*"
        RALT(KC_6): ^
        MS_WHLU: Wheel ↑
        MS_WHLD: Wheel ↓
        MS_LEFT:
            t: ←
            br: 2× hold
        MS_UP:
            t: ↑
            br: 2× hold
        MS_DOWN:
            t: ↓
            br: 2× hold
        MS_RGHT:
            t: →
            br: 2× hold
        MS_BTN1: Mouse 1
        MS_BTN2: Mouse 2
        MS_BTN3: Mouse 3
        MS_BTN4: Mouse 4
        MS_BTN5: Mouse 5
        S(KC_COMM): <
        S(KC_DOT): ">"
        S(KC_6): ^
        S(KC_7): "&"
        S(KC_8): "*"
        S(KC_BSLS): "|"
        S(KC_4): $
        S(KC_LBRC): "{"
        S(KC_RBRC): "}"
        S(KC_GRV): "~"
        S(KC_3): "#"
        S(KC_SCLN): ":"
        S(KC_SLSH): "?"
        S(KC_1): "!"
        S(KC_5): "%"
        S(KC_9): (
        S(KC_0): )
        S(KC_MINS): _
        PYTHON_SHEBANG: "Python #!"
        BASH_SHEBANG: "Bash #!"
        HOME_SLASH:
            t: /
            h: ~/
        SP_MINS:
            t: "-"
            h: ␠-
        COMM_SP:
            t: ","
            h: + Space
        SCLN_SP:
            t: ;
            h: + Space
        DOT_SP:
            t: .
            h: + Space
        HOLD_MAKE:
            t: QMK make
            h: hold 2s
        HOLD_EE_CLEAR:
            t: EEPROM clear
            h: hold 2s
        HOLD_SHOW_VERSION:
            t: Build dates
            h: hold 2s
    sticky_label: sticky
    toggle_label: toggle
    tap_toggle_label: tap-toggle
    trans_legend:
        t: ▽
        type: trans
    layer_legend_map: {}
    mark_alternate_layer_activators: false
    modifier_fn_map:
        left_ctrl: Ctl
        right_ctrl: Ctl
        left_shift: Sft
        right_shift: Sft
        left_alt: Alt
        right_alt: AltGr
        left_gui: Gui
        right_gui: Gui
        keycode_combiner: "{mods}+{key}"
        mod_combiner: "{mod_1}+{mod_2}"
        special_combinations:
            left_ctrl+left_alt+left_gui+left_shift: Hyper
            left_ctrl+left_alt+left_shift: Meh
    qmk_remove_keycode_prefix:
        - KC_
    qmk_keycode_map:
        XXXXXXX: ""
        "NO": ""
        MINUS: "-"
        MINS: "-"
        EQUAL: "="
        EQL: "="
        LEFT_BRACKET: "["
